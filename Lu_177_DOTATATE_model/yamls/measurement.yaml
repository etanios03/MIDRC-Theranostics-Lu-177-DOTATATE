$schema: http://json-schema.org/draft-04/schema#
id: measurement
title: measurement
type: object
namespace: http://localhost/
category: medical_history
program: '*'
project: '*'
description: A structured value (numerical or categorical) obtained through systematic
  examination of a person or sample.
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: conditions
    backref: measurements
    label: part_of
    target_type: condition
    multiplicity: many_to_one
    required: true
  - name: procedures
    backref: measurements
    label: part_of
    target_type: procedure
    multiplicity: many_to_one
    required: true
  - name: cases
    backref: measurements
    label: part_of
    target_type: case
    multiplicity: many_to_one
    required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  case_ids:
    type: array
    items:
      type: string
    description: A human-readable, unique identifier for a record in the metadata
      database. It can be used in place of the UUID for identifying or recalling a
      record (e.g., in data queries or uploads/exports).
  test_days_from_index:
    type: integer
    description: A number of days beginning with the index date and ending with the
      date of the test.
  test_method:
    description: The test method used to confirm a condition or produce a measurement.
    enum:
    - RT-PCR
    - Rapid antigen test
    - Not Reported
  test_name:
    description: The name of the test for which this measurement was the result.
    enum:
    - COVID-19
  test_result_text:
    description: The measured result of the test described using a list of enumerations.
    enum:
    - Indeterminate
    - Negative
    - Positive
    - Not Reported
  conditions:
    $ref: _definitions.yaml#/to_one
  procedures:
    $ref: _definitions.yaml#/to_one
  cases:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
