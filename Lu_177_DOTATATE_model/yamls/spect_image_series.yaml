$schema: http://json-schema.org/draft-04/schema#
id: spect_image_series
title: spect_image_series
type: object
namespace: http://localhost/
category: imaging
program: '*'
project: '*'
description: SPECT imaging files reflecting one acquisition
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- submitter_id
- type
links:
- name: imaging_studys
  backref: spect_image_seriess
  label: part_of
  target_type: imaging_study
  multiplicity: many_to_one
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  submitter_id:
    type: array
    items:
      type: string
    description: A list of one or more case submitter_ids associated with the data
  injected_activity:
    type: number
    description: injected activity
  administration_time:
    $ref: _definitions.yaml#/datetime
  imaging_time:
    $ref: _definitions.yaml#/datetime
  image_acquisition_params:
    type: array
    items:
      type: string
    description: parameters used for image acquisition
  image_reconstruction_params:
    type: array
    items:
      type: string
    description: parameters used for image reconstruction
  image_units:
    type: string
    description: Units of the SPECT image voxel values, e.g. counts, counts/s, Bq/mL
      or MBq; corresponds to DICOM tag (0054,1001) Units where available
  calibration_factor:
    type: number
    description: SPECT system sensitivity calibration factor used to convert reconstructed
      counts to activity for quantitative imaging
  collimator:
    type: string
    description: (0018,1180) Collimator/grid Name. Name of the collimator used for
      the SPECT acquisition
  imaging_studys:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
