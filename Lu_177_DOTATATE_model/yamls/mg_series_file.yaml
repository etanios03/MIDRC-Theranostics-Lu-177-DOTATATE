$schema: http://json-schema.org/draft-04/schema#
id: mg_series_file
title: mg_series_file
type: object
namespace: http://localhost/
category: imaging
program: '*'
project: '*'
description: Information related to a mammography (MG) imaging series to which one
  or more mammography images belong.
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- data_category
- data_format
- data_type
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: core_metadata_collections
    backref: mg_series_files
    label: part_of
    target_type: core_metadata_collection
    multiplicity: many_to_one
    required: true
  - name: imaging_studys
    backref: mg_series_files
    label: part_of
    target_type: imaging_study
    multiplicity: many_to_one
    required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  case_ids:
    type: array
    items:
      type: string
    description: A list of one or more case submitter_ids associated with this data.
  code_meaning:
    type: array
    items:
      type: string
    description: (0008,0104) Code Meaning. Note that code_meaning is pulled from the
      View Code Sequence (0054,0220).
  contrast_bolus_agent:
    type: array
    items:
      type: string
    description: (0018, 0010) Contrast/Bolus Agent.
  detector_type:
    description: (0018, 7004) Detector Type.
    enum:
    - DIRECT
    - SCINTILLATOR
    - STORAGE
    - FILM
  image_data_modification_name:
    type: integer
    description: A MIDRC classification describing specific methods (e.g., software
      tools, processes) used to modify the study series. More information can be found
      at midrc.org.
  image_data_modification_method:
    description: A categorical description of the type of image modification performed
      on the study series.
    enum:
    - Removal of alphanumeric characters
    - Defacing
    - Skull-stripping
  image_data_modified:
    type: boolean
    description: An indicator of whether any post-clinical modification of image pixel
      data has been performed on the study series.
  image_type:
    type: array
    items:
      type: string
    description: (0008, 0008) Image Type.
  imager_pixel_spacing:
    type: array
    items:
      type: string
    description: (0018, 1164) Imager Pixel Spacing.
  lossy_image_compression:
    description: (0028, 2110) Lossy Image Compression; Note, if an image is compressed
      with a lossy algorithm, the Attribute Lossy Image Compression (0028,2110) is
      set to "01". Subsequently, if the image is decompressed and transferred in uncompressed
      format, this Attribute value remains "01".
    enum:
    - '00'
    - '01'
  manufacturer:
    type: string
    description: (0008, 0070) Manufacturer.
  manufacturer_model_name:
    type: string
    description: (0008, 1090) Manufacturer's Model Name.
  modality:
    type: string
    description: (0008, 0060) Modality.
  number_of_instances:
    type: integer
    description: The number of instances included in this series.
  pixel_spacing:
    type: array
    items:
      type: string
    description: (0028, 0030) Pixel Spacing.
  series_description:
    type: string
    description: (0008, 103e) Series Description.
  series_uid:
    type: string
    description: (0020, 000e) Series Instance UID.
  sop_class_name:
    description: The textual description for the (0008, 0016) SOP Class UID Attribute.
    enum:
    - Digital Mammography X-Ray Image Storage - For Presentation
    - Digital Mammography X-Ray Image Storage - For Processing
    - Breast Tomosynthesis Image Storage
    - Breast Projection X-Ray Image Storage - For Presentation
    - Breast Projection X-Ray Image Storage - For Processing
  sop_class_uid:
    description: (0008, 0016) SOP Class UID Attribute..
    enum:
    - 1.2.840.10008.5.1.4.1.1.1.2
    - 1.2.840.10008.5.1.4.1.1.1.2.1
    - 1.2.840.10008.5.1.4.1.1.13.1.3
    - 1.2.840.10008.5.1.4.1.1.13.1.4
    - 1.2.840.10008.5.1.4.1.1.13.1.5
  spatial_resolution:
    type: number
    description: (0018, 1050) Spatial Resolution.
  view_position:
    type: array
    items:
      type: string
    description: (0018, 5101) View Position.
  data_category:
    description: Broad categorization of the contents of the data file.
    enum:
    - MG
  data_format:
    description: Format of the data files.
    enum:
    - DCM
    - nii.gz
  data_type:
    description: Specific content type of the data file.
    enum:
    - DICOM
    - NIfTI
  core_metadata_collections:
    $ref: _definitions.yaml#/to_one
  imaging_studys:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
