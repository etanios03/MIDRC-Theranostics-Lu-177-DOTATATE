$schema: http://json-schema.org/draft-04/schema#
id: case
title: case
type: object
namespace: http://localhost/
category: administrative
program: '*'
project: '*'
description: The collection of all data related to a specific patient or case in the
  context of a specific dataset or experiment.
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- case_id
- submitter_id
- type
links:
- name: datasets
  backref: cases
  label: part_of
  target_type: dataset
  multiplicity: many_to_many
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  case_ids:
    type: array
    items:
      type: string
    description: A list of one or more case submitter_ids associated with this data.
  age_at_index:
    type: number
    description: The study participant's age, in years, at the index event. The index
      event is determined by the data submitter and used as an anchor date for all
      temporal variables. Note that an age of 0 indicates a participant who is younger
      than 1 year old. For participants with ages greater than 89 years, please use
      the property 'age_at_index_gt89'. This property is included to ensure personal
      privacy protection in accordance with the HIPAA Safe Harbor Method. More information
      can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
  age_at_index_gt89:
    description: Indicates whether the subject's age at the time of the study was
      greater than 89 years. This property is included to ensure personal privacy
      protection in accordance with the HIPAA Safe Harbor Method. More information
      can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    enum:
    - 'Yes'
    - 'No'
  country_of_residence:
    type: string
    description: The country where the subject resides.
  covid19_positive:
    description: 'An indicator of whether the patient has ever had a positive COVID-19
      test or been diagnosed with one of the following ICD-10 COVID-19 conditions:
      COVID-19 (U07. 1), Influenza due to unidentified influenza virus with other
      manifestations (J11.8), Post COVID-19 condition (U09.9), Myalgic encephalomyelitis/chronic
      fatigue syndrome (G93.32), or Sequelae of other specified infectious and parasitic
      diseases (B94.8). For more information about a patient''s specific COVID-19
      diagnosis, details can be found under Condition.'
    enum:
    - 'Yes'
    - 'No'
    - Indeterminate
    - Not Reported
  ethnicity:
    description: A social group characterized by a distinctive social and cultural
      tradition that is maintained from generation to generation. Members share a
      common history and origin and a sense of identification with the group. They
      have similar and distinctive features in their lifestyle habits and shared experiences.
      They often have a common genetic heritage which may be reflected in their experience
      of health and disease.
    enum:
    - Hispanic or Latino
    - Not Hispanic or Latino
    - Not Reported
  gen3_linked_subjects_available:
    type: boolean
    description: Indicates whether there is data available for the subject in other
      data resources.
  icu_indicator:
    type: boolean
    description: Indicates whether the subject has been admitted to the ICU.
  index_event:
    description: The event used as the anchor or start date for all temporal data
      elements. This acts as day 0 on a timeline of events relating to the patient.
      This property is included to ensure personal privacy protection in accordance
      with the HIPAA Safe Harbor Method. More information can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    enum:
    - COVID-19 Test
    - Long COVID Diagnosis
    - Study Enrollment
    - First Imaging Study
  linked_external_data:
    type: array
    items:
      type: string
    description: A list of all external data resources that are confirmed to have
      data for the case.
  long_covid_diagnosis:
    description: 'An indicator of whether the patient has ever been diagnosed with
      one of the following ICD-10 long COVID-19 conditions: U09.9 (Post COVID-19 condition,
      unspecified), G93.32 (Myalgic encephalomyelitis/chronic fatigue syndrome), and
      B94.8 (Sequelae of other specified infectious and parasitic diseases). ''Positive''
      means the patient was diagnosed with a long COVID condition, while ''Not Reported''
      means the patient has never been diagnosed with a long COVID condition.'
    enum:
    - Positive
    - Not Reported
  race:
    description: A geographic ancestral origin category that is assigned to a population
      group based mainly on physical characteristics that are thought to be distinct
      and inherent.
    enum:
    - American Indian or Alaska Native
    - Asian
    - Black or African American
    - Native Hawaiian or other Pacific Islander
    - Other
    - White
    - Not Reported
  sex:
    description: The biologic character or quality that distinguishes male and female
      from one another as expressed by analysis of the person's gonadal, morphologic
      (internal and external), chromosomal, and hormonal characteristics.
    enum:
    - Female
    - Male
    - Not Reported
  site_id:
    type: string
    description: A de-identified code used to classify a case as part of a specific
      data submission.
  token_record_id:
    type: string
    description: An ID used to link a de-identified case in MIDRC to the same case
      in an external data resource.
  treatment_info:
    type: boolean
    description: Indicates whether detailed treatment information is available for
      the subject.
  ventilator_indicator:
    type: boolean
    description: Indicates whether the subject has been on a ventilator.
  zip:
    type: string
    description: The three-digit United States zip code of residence for any population
      greater than 20,000. For zip codes where the three digit number represents a
      population less than 20,000 "000" will be provided.
  case_id:
    type: string
    description: A deidentified identifier for the subject
  datasets:
    $ref: _definitions.yaml#/to_many
additionalProperties: false
