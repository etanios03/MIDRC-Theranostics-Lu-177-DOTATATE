$schema: http://json-schema.org/draft-04/schema#
id: procedure
title: procedure
type: object
namespace: http://localhost/
category: medical_history
program: '*'
project: '*'
description: Activities or processes ordered by and/or carried out by a healthcare
  provider on the patient with diagnostic and/or therapeutic purposes.
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: conditions
    backref: procedures
    label: part_of
    target_type: condition
    multiplicity: many_to_one
    required: true
  - name: cases
    backref: procedures
    label: part_of
    target_type: case
    multiplicity: many_to_one
    required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  case_ids:
    type: array
    items:
      type: string
    description: A human-readable, unique identifier for a record in the metadata
      database. It can be used in place of the UUID for identifying or recalling a
      record (e.g., in data queries or uploads/exports).
  breathing_support_type:
    type: string
    description: The type of breathing support the patient received.
  days_to_procedure_start:
    type: integer
    description: The number of days between the case's index date and the start date
      of the procedure.
  days_to_procedure_end:
    type: integer
    description: The number of days between the case's index date and the end date
      of the procedure.
  procedure_name:
    description: The name of the procedure performed.
    enum:
    - Breathing Support
  conditions:
    $ref: _definitions.yaml#/to_one
  cases:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
