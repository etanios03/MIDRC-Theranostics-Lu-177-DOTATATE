$schema: http://json-schema.org/draft-04/schema#
id: annotation_file
title: annotation_file
type: object
namespace: http://localhost/
category: data_file
program: '*'
project: '*'
description: The annotation_file node provides the ability to link a file containing
  annotation information to a case, imaging study or imaging series.
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- annotation_name
- data_category
- data_format
- data_type
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: core_metadata_collections
    backref: annotation_files
    label: part_of
    target_type: core_metadata_collection
    multiplicity: many_to_one
    required: true
  - name: datasets
    backref: annotation_files
    label: part_of
    target_type: dataset
    multiplicity: many_to_one
    required: true
  - name: cases
    backref: annotation_files
    label: part_of
    target_type: case
    multiplicity: many_to_one
    required: true
  - name: imaging_studys
    backref: annotation_files
    label: part_of
    target_type: imaging_study
    multiplicity: many_to_one
    required: true
  - name: cr_series_files
    backref: annotation_files
    label: part_of
    target_type: cr_series_file
    multiplicity: many_to_one
    required: true
  - name: ct_series_files
    backref: annotation_files
    label: part_of
    target_type: ct_series_file
    multiplicity: many_to_one
    required: true
  - name: dx_series_files
    backref: annotation_files
    label: part_of
    target_type: dx_series_file
    multiplicity: many_to_one
    required: true
  - name: mg_series_files
    backref: annotation_files
    label: part_of
    target_type: mg_series_file
    multiplicity: many_to_one
    required: true
  - name: mr_series_files
    backref: annotation_files
    label: part_of
    target_type: mr_series_file
    multiplicity: many_to_one
    required: true
  - name: nm_series_files
    backref: annotation_files
    label: part_of
    target_type: nm_series_file
    multiplicity: many_to_one
    required: true
  - name: pt_series_files
    backref: annotation_files
    label: part_of
    target_type: pt_series_file
    multiplicity: many_to_one
    required: true
  - name: rf_series_files
    backref: annotation_files
    label: part_of
    target_type: rf_series_file
    multiplicity: many_to_one
    required: true
  - name: us_series_files
    backref: annotation_files
    label: part_of
    target_type: us_series_file
    multiplicity: many_to_one
    required: true
  - name: xa_series_files
    backref: annotation_files
    label: part_of
    target_type: xa_series_file
    multiplicity: many_to_one
    required: true
  - name: core_metadata_collections
    backref: annotation_files
    label: part_of
    target_type: core_metadata_collection
    multiplicity: one_to_one
    required: false
properties:
  $ref: _definitions.yaml#/data_file_properties
  case_ids:
    type: array
    items:
      type: string
    description: A list of one or more case submitter_ids associated with this data.
  annotation_long_name:
    type: string
    description: The long name of the annotation provides more information about the
      specific annotation.
  annotation_method:
    description: Defines the method by which the annotation was created. Clinically_derived
      - Based on information produced in the process of the subject's medical care;
      Retrospective_expert - Based on information produced retrospective to the subject's
      care by annotators with relevant special clinical expertise; Retrospective_general
      - Based on information produced retrospective to the subject's care by annotators
      without relevant special clinical expertise; Retrospective_auto - Based on information
      produced retrospective to the subject's care using automated means.
    enum:
    - Clinically_derived
    - Retrospective_expert
    - Retrospective_general
    - Retrospective_auto
  annotation_name:
    description: The name of the annotation. These names are unique and assigned by
      MIDRC. Annotation names reference a document posted on the MIDRC website describing
      the annotation, methods and values expected. All MIDRC created annotations start
      with "midrc_".
    enum:
    - midrc_bpr_landmarks
    - midrc_bpr_regions
    - midrc_lung_segs
    - midrc_lung_measures
    - midrc_mdai_chestxr
    - midrc_mRALE_Mastermind_Challenge
    - uchicago_msk_shoulder_labrum
    - duke-CSpineSeg
    - SIFT
  annotator_id:
    type: string
    description: Coded value to represent a particular annotator in a group. These
      need only be unique per annotation.
  instance_uids:
    type: array
    items:
      type: string
    description: Used to denote that this annotation applies only to specific images
      (image instances) in a series. If absent, an annotation that references an imaging
      series node applies to the entire imaging series.
  software_versions:
    type: string
    description: (0018,1020) Software Versions. This is the software version of the
      application where the annotation series was created.
  data_category:
    description: The category of the file; must be "annotation_file".
    enum:
    - annotation_file
  data_format:
    description: The file format of the annotation file, e.g., JSON.
    enum:
    - XML
    - JSON
    - CSV
    - JPEG
    - TIF
    - TXT
    - NII
  data_type:
    description: "An indication of whether the annotation is expert validated by MIDRC\
      \ (\u201CInternal Annotation\u201D) or has not been validated by MIDRC experts\
      \ (\u201CExternal Annotation\u201D)."
    enum:
    - Internal Annotation
    - External Annotation
  core_metadata_collections:
    $ref: _definitions.yaml#/to_one
  datasets:
    $ref: _definitions.yaml#/to_one
  cases:
    $ref: _definitions.yaml#/to_one
  imaging_studys:
    $ref: _definitions.yaml#/to_one
  cr_series_files:
    $ref: _definitions.yaml#/to_one
  ct_series_files:
    $ref: _definitions.yaml#/to_one
  dx_series_files:
    $ref: _definitions.yaml#/to_one
  mg_series_files:
    $ref: _definitions.yaml#/to_one
  mr_series_files:
    $ref: _definitions.yaml#/to_one
  nm_series_files:
    $ref: _definitions.yaml#/to_one
  pt_series_files:
    $ref: _definitions.yaml#/to_one
  rf_series_files:
    $ref: _definitions.yaml#/to_one
  us_series_files:
    $ref: _definitions.yaml#/to_one
  xa_series_files:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
