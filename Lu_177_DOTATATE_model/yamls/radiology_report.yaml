$schema: http://json-schema.org/draft-04/schema#
id: radiology_report
title: radiology_report
type: object
namespace: http://localhost/
category: data_file
program: '*'
project: '*'
description: A detailed report that describes the results of an imaging test. A radiology
  report can include narrative information about the type of imaging test that was
  done, how it was done, and any labels representing the results of the test.
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- data_category
- data_format
- data_type
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: core_metadata_collections
    backref: radiology_reports
    label: part_of
    target_type: core_metadata_collection
    multiplicity: many_to_one
    required: true
  - name: datasets
    backref: radiology_reports
    label: part_of
    target_type: dataset
    multiplicity: many_to_one
    required: true
  - name: cases
    backref: radiology_reports
    label: part_of
    target_type: case
    multiplicity: many_to_one
    required: true
  - name: imaging_studys
    backref: radiology_reports
    label: part_of
    target_type: imaging_study
    multiplicity: many_to_many
    required: true
  - name: core_metadata_collections
    backref: radiology_reports
    label: part_of
    target_type: core_metadata_collection
    multiplicity: one_to_one
    required: false
properties:
  $ref: _definitions.yaml#/data_file_properties
  submitter_id:
    type: array
    items:
      type: string
    description: A human-readable, unique identifier for a record in the metadata
      database. It can be used in place of the UUID for identifying or recalling a
      record (e.g., in data queries or uploads/exports).
  body_part_examined:
    type: array
    items:
      type: string
    description: (0018, 0015) Body Part Examined.
  data_category:
    description: Broad categorization of the contents of the data file.
    enum:
    - Radiology Report
  data_format:
    description: Format of the data files.
    enum:
    - CSV
    - DICOM
    - JSON
    - PDF
    - RTF
    - TSV
    - TXT
    - XML
  data_type:
    description: Specific content type of the data file.
    enum:
    - Radiology Report
  modality:
    type: string
    description: (0008, 0060) Modality
  report_generation_method:
    description: A categorical description of the way the report was generated, either
      through clinical care (Clinical) or through computational means (Synethic).
    enum:
    - Clinical
    - Synthetic
  report_modification_method:
    description: A categorical description of the type of modification performed on
      the report, either by redaction of sensitive information (Redacted) or by obscuring
      it through replacement with random or shifted values (Synthetic replacement).
    enum:
    - Redacted
    - Synthetic replacement
  study_description:
    type: string
    description: (0008, 1030) Study Description.
  core_metadata_collections:
    $ref: _definitions.yaml#/to_one
  datasets:
    $ref: _definitions.yaml#/to_one
  cases:
    $ref: _definitions.yaml#/to_one
  imaging_studys:
    $ref: _definitions.yaml#/to_many
additionalProperties: false
