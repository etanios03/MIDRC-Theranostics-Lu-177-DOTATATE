$schema: http://json-schema.org/draft-04/schema#
id: cr_series_file
title: cr_series_file
type: object
namespace: http://localhost/
category: imaging
program: '*'
project: '*'
description: A package of image files and metadata related to a CR imaging series
  to which one or more computed radiograph (CR) instances belong.
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- md5sum
- file_size
- file_name
- data_category
- data_format
- data_type
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: core_metadata_collections
    backref: cr_series_files
    label: part_of
    target_type: core_metadata_collection
    multiplicity: many_to_one
    required: true
  - name: imaging_studys
    backref: cr_series_files
    label: part_of
    target_type: imaging_study
    multiplicity: many_to_one
    required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  submitter_id:
    type: array
    items:
      type: string
    description: A human-readable, unique identifier for a record in the metadata
      database. It can be used in place of the UUID for identifying or recalling a
      record (e.g., in data queries or uploads/exports).
  md5sum:
    type: string
    description: The 128-bit hash value expressed as a 32 digit hexadecimal number
      used as a file's digital fingerprint.
  file_size:
    type: integer
    description: The size of the data file (object) in bytes.
  file_name:
    type: string
    description: The name (or part of a name) of a file (of any type).
  contrast_bolus_agent:
    type: array
    items:
      type: string
    description: (0018, 0010) Contrast/Bolus Agent.
  detector_type:
    description: (0018, 7004) Detector Type.
    enum:
    - DIRECT
    - SCINTILLATOR
    - STORAGE
    - FILM
  image_data_modification_name:
    type: integer
    description: A MIDRC classification describing specific methods (e.g., software
      tools, processes) used to modify the study series. More information can be found
      at midrc.org.
  image_data_modification_method:
    description: A categorical description of the type of image modification performed
      on the study series.
    enum:
    - Removal of alphanumeric characters
    - Defacing
    - Skull-stripping
  image_data_modified:
    type: boolean
    description: An indicator of whether any post-clinical modification of image pixel
      data has been performed on the study series.
  image_type:
    type: array
    items:
      type: string
    description: (0008, 0008) Image Type.
  imager_pixel_spacing:
    type: array
    items:
      type: string
    description: (0018, 1164) Imager Pixel Spacing.
  lossy_image_compression:
    description: (0028, 2110) Lossy Image Compression; Note, if an image is compressed
      with a lossy algorithm, the Attribute Lossy Image Compression (0028,2110) is
      set to "01". Subsequently, if the image is decompressed and transferred in uncompressed
      format, this Attribute value remains "01".
    enum:
    - '00'
    - '01'
  manufacturer:
    type: string
    description: (0008, 0070) Manufacturer.
  manufacturer_model_name:
    type: string
    description: (0008, 1090) Manufacturer's Model Name.
  modality:
    type: string
    description: (0008, 0060) Modality.
  number_of_instances:
    type: integer
    description: The number of instances included in this series.
  pixel_spacing:
    type: array
    items:
      type: string
    description: (0028, 0030) Pixel Spacing.
  series_description:
    type: string
    description: (0008, 103e) Series Description.
  series_uid:
    type: string
    description: (0020, 000e) Series Instance UID.
  spatial_resolution:
    type: number
    description: (0018, 1050) Spatial Resolution.
  view_position:
    type: array
    items:
      type: string
    description: (0018, 5101) View Position.
  data_category:
    description: Broad categorization of the contents of the data file.
    enum:
    - CR
  data_format:
    description: Format of the data files.
    enum:
    - DCM
    - nii.gz
  data_type:
    description: Specific content type of the data file.
    enum:
    - DICOM
    - NIfTI
  core_metadata_collections:
    $ref: _definitions.yaml#/to_one
  imaging_studys:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
