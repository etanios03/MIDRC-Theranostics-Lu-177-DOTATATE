$schema: http://json-schema.org/draft-04/schema#
id: observation
title: observation
type: object
namespace: http://localhost/
category: medical_history
program: '*'
project: '*'
description: Information about the subject obtained in the context of examination,
  questioning orduring a procedure.
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: cases
  backref: observations
  label: part_of
  target_type: case
  multiplicity: many_to_one
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  case_ids:
    type: array
    items:
      type: string
    description: A list of one or more case submitter_ids associated with this data.
  observation_name:
    type: string
    description: The short name of the observation about the subject obtained in the
      context of examination, questioning or a during procedure.
  observation_answer:
    type: string
    description: The answer or value provided for a specific observation about a subject
      obtained in the context of examination, questioning or during a procedure.
  days_to_observation:
    type: integer
    description: The number of days from the index date to the date of the observation.
  cases:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
