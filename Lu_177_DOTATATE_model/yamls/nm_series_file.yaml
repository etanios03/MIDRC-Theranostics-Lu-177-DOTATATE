$schema: http://json-schema.org/draft-04/schema#
id: nm_series_file
title: nm_series_file
type: object
namespace: http://localhost/
category: imaging
program: '*'
project: '*'
description: 'Information related to a NM imaging series to which one or more nuclear
  medicine images belong. Also carries the radiopharmaceutical therapy (RPT) acquisition
  metadata: planar nm imaging files reflecting one acquisition.'
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- case_ids
- data_category
- data_format
- data_type
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: core_metadata_collections
    backref: nm_series_files
    label: part_of
    target_type: core_metadata_collection
    multiplicity: many_to_one
    required: true
  - name: imaging_studys
    backref: nm_series_files
    label: part_of
    target_type: imaging_study
    multiplicity: many_to_one
    required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  case_ids:
    type: array
    items:
      type: string
    description: A list of one or more case submitter_ids associated with this data.
  body_part_examined:
    type: array
    items:
      type: string
    description: (0018, 0015) Body Part Examined.
  image_data_modification_name:
    type: integer
    description: A MIDRC classification describing specific methods (e.g., software
      tools, processes) used to modify the study series. More information can be found
      at midrc.org.
  image_data_modification_method:
    description: A categorical description of the type of image modification performed
      on the study series.
    enum:
    - Removal of alphanumeric characters
    - Defacing
    - Skull-stripping
  image_data_modified:
    type: boolean
    description: An indicator of whether any post-clinical modification of image pixel
      data has been performed on the study series.
  lossy_image_compression:
    description: (0028, 2110) Lossy Image Compression; Note, if an image is compressed
      with a lossy algorithm, the Attribute Lossy Image Compression (0028,2110) is
      set to "01". Subsequently, if the image is decompressed and transferred in uncompressed
      format, this Attribute value remains "01".
    enum:
    - '00'
    - '01'
  manufacturer:
    type: string
    description: (0008, 0070) Manufacturer.
  manufacturer_model_name:
    type: string
    description: (0008, 1090) Manufacturer's Model Name.
  modality:
    type: string
    description: (0008, 0060) Modality.
  number_of_instances:
    type: integer
    description: The number of instances included in this series.
  radiopharmaceutical:
    type: string
    description: (0018,0031) Radiopharmaceutical.
  series_description:
    type: string
    description: (0008, 103e) Series Description.
  series_uid:
    type: string
    description: (0020, 000e) Series Instance UID.
  data_category:
    description: Broad categorization of the contents of the data file.
    enum:
    - NM
  data_format:
    description: Format of the data files.
    enum:
    - DCM
    - nii.gz
  data_type:
    description: Specific content type of the data file.
    enum:
    - DICOM
    - NIfTI
  injected_activity:
    type: number
    description: injected activity
  injection_time:
    $ref: _definitions.yaml#/datetime
  imaging_time:
    $ref: _definitions.yaml#/datetime
  image_acquisition_params:
    type: array
    items:
      type: string
    description: parameters used for image acquisition
  image_reconstruction_params:
    type: array
    items:
      type: string
    description: parameters used for image reconstruction
  core_metadata_collections:
    $ref: _definitions.yaml#/to_one
  imaging_studys:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
