$schema: http://json-schema.org/draft-04/schema#
id: dicom_annotation_file
title: dicom_annotation_file
type: object
namespace: http://localhost/
category: data_file
program: '*'
project: '*'
description: The dicom_annotation_file node provides the ability to link a DICOM series
  file containing annotation information to an imaging study.
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- series_description
- annotation_name
- modality
- series_uid
- data_category
- data_format
- data_type
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: core_metadata_collections
    backref: dicom_annotation_files
    label: part_of
    target_type: core_metadata_collection
    multiplicity: many_to_one
    required: true
  - name: imaging_studys
    backref: dicom_annotation_files
    label: part_of
    target_type: imaging_study
    multiplicity: many_to_one
    required: true
  - name: core_metadata_collections
    backref: dicom_annotation_files
    label: part_of
    target_type: core_metadata_collection
    multiplicity: one_to_one
    required: false
properties:
  $ref: _definitions.yaml#/data_file_properties
  submitter_id:
    type: array
    items:
      type: string
    description: A human-readable, unique identifier for a record in the metadata
      database. It can be used in place of the UUID for identifying or recalling a
      record (e.g., in data queries or uploads/exports).
  annotation_method:
    description: Defines the method by which the annotation was created. Clinically_derived
      - Based on information produced in the process of the subject's medical care;
      Retrospective_expert - Based on information produced retrospective to the subject's
      care by annotators with relevant special clinical expertise; Retrospective_general
      - Based on information produced retrospective to the subject's care by annotators
      without relevant special clinical expertise; Retrospective_auto - Based on information
      produced retrospective to the subject's care using automated means.
    enum:
    - Clinically_derived
    - Retrospective_expert
    - Retrospective_general
    - Retrospective_auto
  annotator_id:
    type: string
    description: Coded value to represent a particular annotator in a group. These
      need only be unique per annotation.
  series_description:
    type: string
    description: (0008, 103e) Series Description; a general description of or additional
      information about the imaging series. If possible, the Series Description should
      match the annotation_name provided.
  annotation_name:
    description: The name of the annotation. These names are unique and assigned by
      MIDRC. Annotation names reference a document posted on the MIDRC website describing
      the annotation, methods and values expected. All MIDRC created annotations start
      with "midrc_".
    enum:
    - midrc_bpr_landmarks
    - midrc_bpr_regions
    - midrc_lung_segs
    - midrc_lung_measures
    - midrc_mdai_chestxr
    - midrc_mRALE_Mastermind_Challenge
    - SIFT
  manufacturer:
    type: string
    description: (0008, 0070) Manufacturer
  manufacturer_model_name:
    type: string
    description: (0008, 1090) Manufacturer's Model Name
  modality:
    description: (0008, 0060) Modality
    enum:
    - RTSTRUCT
    - PR
    - SR
    - SEG
    - DOC
    - OT
  series_uid:
    type: string
    description: (0020, 000e) Series Instance UID; the UID or unique identification
      code of the imaging series.
  software_versions:
    type: string
    description: (0018,1020) Software Versions. This is the software version of the
      application where the annotation series was created.
  data_category:
    description: The category of the annotation file. Must be "DICOM Annotation Series
      File".
    enum:
    - DICOM Annotation Series File
  data_format:
    description: The file format of the annotation file, e.g., JSON.
    enum:
    - DCM
  data_type:
    description: "An indication of whether the annotation is expert validated by MIDRC\
      \ (\u201CInternal Annotation\u201D) or has not be validated by MIDRC experts\
      \ (\u201CExternal Annotation\u201D)."
    enum:
    - Internal Annotation
    - External Annotation
  core_metadata_collections:
    $ref: _definitions.yaml#/to_one
  imaging_studys:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
