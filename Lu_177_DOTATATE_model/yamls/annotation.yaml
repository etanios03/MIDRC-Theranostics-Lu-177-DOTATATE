$schema: http://json-schema.org/draft-04/schema#
id: annotation
title: annotation
type: object
namespace: http://localhost/
category: notation
program: '*'
project: '*'
description: Information describing characteristics of imaging studies, series and
  instances (e.g., segmentations, bounding boxes, feature labels) and inferences based
  on those characteristics (e.g., predicted diagnoses). Annotations may be recorded
  in the course of clinical care or retrospectively for purposes of research (e.g.,
  imaging annotations from PACS or retrospective labeling tools). Please refer to
  https://midrc.org/annotations to learn more about a particular batch of annotations.
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: datasets
    backref: annotations
    label: part_of
    target_type: dataset
    multiplicity: many_to_one
    required: true
  - name: cases
    backref: annotations
    label: part_of
    target_type: case
    multiplicity: many_to_one
    required: true
  - name: imaging_studys
    backref: annotations
    label: part_of
    target_type: imaging_study
    multiplicity: many_to_one
    required: true
  - name: cr_series_files
    backref: annotations
    label: part_of
    target_type: cr_series_file
    multiplicity: many_to_one
    required: true
  - name: ct_series_files
    backref: annotations
    label: part_of
    target_type: ct_series_file
    multiplicity: many_to_one
    required: true
  - name: dx_series_files
    backref: annotations
    label: part_of
    target_type: dx_series_file
    multiplicity: many_to_one
    required: true
  - name: mg_series_files
    backref: annotations
    label: part_of
    target_type: mg_series_file
    multiplicity: many_to_one
    required: true
  - name: mr_series_files
    backref: annotations
    label: part_of
    target_type: mr_series_file
    multiplicity: many_to_one
    required: true
  - name: nm_series_files
    backref: annotations
    label: part_of
    target_type: nm_series_file
    multiplicity: many_to_one
    required: true
  - name: pt_series_files
    backref: annotations
    label: part_of
    target_type: pt_series_file
    multiplicity: many_to_one
    required: true
  - name: rf_series_files
    backref: annotations
    label: part_of
    target_type: rf_series_file
    multiplicity: many_to_one
    required: true
  - name: us_series_files
    backref: annotations
    label: part_of
    target_type: us_series_file
    multiplicity: many_to_one
    required: true
  - name: xa_series_files
    backref: annotations
    label: part_of
    target_type: xa_series_file
    multiplicity: many_to_one
    required: true
  - name: annotation_files
    backref: annotations
    label: part_of
    target_type: annotation_file
    multiplicity: many_to_one
    required: true
  - name: dicom_annotation_files
    backref: annotations
    label: part_of
    target_type: dicom_annotation_file
    multiplicity: many_to_one
    required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  submitter_id:
    type: array
    items:
      type: string
    description: A human-readable, unique identifier for a record in the metadata
      database. It can be used in place of the UUID for identifying or recalling a
      record (e.g., in data queries or uploads/exports).
  airspace_disease_grading:
    description: Values are extracted from the annotation file midrc_mdai_chestxr.
      Accepted values are "mild" opacities (1-2 lung zones), "moderate" opacities
      (3-4 lung zones), and "severe" opacities (>4 lung zones).
    enum:
    - mild
    - moderate
    - severe
  annotator_id:
    type: string
    description: Coded value to represent a particular annotator in a group. These
      need only be unique per annotation.
  annotation_long_name:
    type: string
    description: The long name of the annotation provides more information about the
      specific annotation.
  annotation_method:
    description: Defines the method by which the annotation was created. Clinically_derived
      - Based on information produced in the process of the subject's medical care;
      Retrospective_expert - Based on information produced retrospective to the subject's
      care by annotators with relevant special clinical expertise; Retrospective_general
      - Based on information produced retrospective to the subject's care by annotators
      without relevant special clinical expertise; Retrospective_auto - Based on information
      produced retrospective to the subject's care using automated means.
    enum:
    - Clinically_derived
    - Retrospective_expert
    - Retrospective_general
    - Retrospective_auto
  annotation_name:
    description: The name of the annotation. These names are unique and assigned by
      MIDRC. Annotation names reference a document posted on the MIDRC website describing
      the annotation, methods and values expected. All MIDRC created annotations start
      with "midrc_".
    enum:
    - midrc_bpr_landmarks
    - midrc_bpr_regions
    - midrc_lung_segs
    - midrc_lung_measures
    - midrc_mdai_chestxr
    - midrc_mRALE_Mastermind_Challenge
    - SIFT
  class_covid19_pneumonia:
    description: Values are extracted from the annotation file midrc_mdai_chestxr;
      Accepted values include "typical" appearance, which is multifocal bilateral,
      peripheral opacities, or opacities with rounded morphology, lower lung-predominant
      distribution; "indeterminate" appearance, which is absence of typical findings
      and unilateral, central or upper lung predominant distribution of airspace disease;
      "atypical" appearance, which is pneumothorax or pleural effusion, pulmonary
      edema, lobar consolidation, solitary lung nodule, or mass diffuse tiny nodules
      cavity; "negative" for pneumonia, which is no lung opacities.
    enum:
    - atypical
    - indeterminate
    - negative
    - typical
  instance_uids:
    type: array
    items:
      type: string
    description: Used to denote that this annotation applies only to specific images
      (image instances) in a series. If absent, an annotation that references an imaging
      series node applies to the entire imaging series.
  midrc_mRALE_score:
    type: integer
    description: Values are extracted from the annotation file mRALE_Mastermind_Challenge.
      The Radiographic Assessment of Lung Edema (RALE) score is provided as a reference
      standard assessment of disease severity on chest radiograph. A normal chest
      radiograph receives a score of 0, while a chest radiograph with complete consolidation
      of both lungs receives the maximum score of 24.
  sift_image_quality_index:
    description: A score of image quality based on the SIFT annotation software.
    enum:
    - A
    - B
    - C
    - D
    - Not Reported
  software_version:
    type: string
    description: (0018, 1020) Software Version(s).
  datasets:
    $ref: _definitions.yaml#/to_one
  cases:
    $ref: _definitions.yaml#/to_one
  imaging_studys:
    $ref: _definitions.yaml#/to_one
  cr_series_files:
    $ref: _definitions.yaml#/to_one
  ct_series_files:
    $ref: _definitions.yaml#/to_one
  dx_series_files:
    $ref: _definitions.yaml#/to_one
  mg_series_files:
    $ref: _definitions.yaml#/to_one
  mr_series_files:
    $ref: _definitions.yaml#/to_one
  nm_series_files:
    $ref: _definitions.yaml#/to_one
  pt_series_files:
    $ref: _definitions.yaml#/to_one
  rf_series_files:
    $ref: _definitions.yaml#/to_one
  us_series_files:
    $ref: _definitions.yaml#/to_one
  xa_series_files:
    $ref: _definitions.yaml#/to_one
  annotation_files:
    $ref: _definitions.yaml#/to_one
  dicom_annotation_files:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
