$schema: http://json-schema.org/draft-04/schema#
id: imaging_study
title: imaging_study
type: object
namespace: http://localhost/
category: medical_history
program: '*'
project: '*'
description: Information related to an imaging study or exam done for diagnostic or
  research purposes, including patient clinical or contextual data recorded at the
  time of the imaging study.
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- case_ids
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: cases
    backref: imaging_studys
    label: part_of
    target_type: case
    multiplicity: many_to_one
    required: true
  - name: therapy_cycles
    backref: imaging_studys
    label: part_of
    target_type: therapy_cycle
    multiplicity: many_to_one
    required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  case_ids:
    type: array
    items:
      type: string
    description: A list of one or more case submitter_ids associated with this data.
  age_at_imaging:
    type: number
    description: The study participant's age, in years, at the time the imaging study
      was performed. Note that an age of 0 indicates a participant who is younger
      than 1 year old. For participants with ages greater than 89 years, please use
      the property 'age_at_index_gt89'.
  age_at_imaging_gt89:
    description: Indicates whether the age of the patient in years at the time the
      imaging study was performed is greater than 89 years. This property is included
      to ensure personal privacy protection in accordance with the HIPAA Safe Harbor
      Method. More information can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    enum:
    - 'Yes'
    - 'No'
  body_part_examined:
    type: array
    items:
      type: string
    description: (0018, 0015) Body Part Examined.
  days_from_study_to_neg_covid_test:
    type: array
    items:
      type: string
    description: The number of days from the imaging study to the patient's negative
      COVID-19 test(s). This property takes a list of values, each of which represents
      a COVID-19 test for the patient. A positive value for this property means that
      a negative COVID-19 test result was obtained for the patient that many days
      after the imaging study was performed. A negative value indicates that a negative
      COVID-19 test result was obtained prior to the date of imaging. This property
      is included to ensure personal privacy protection in accordance with the HIPAA
      Safe Harbor Method. More information can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
  days_from_study_to_pos_covid_test:
    type: array
    items:
      type: string
    description: The number of days from the imaging study to the patient's positive
      COVID-19 test(s). This property takes a list of values, each of which represents
      a COVID-19 test for the patient. A positive value for this property means that
      a positive COVID-19 test result was obtained for the patient that many days
      after the imaging study was performed. A negative value indicates that the positive
      COVID-19 test result was obtained prior to the date of imaging. This property
      is included to ensure personal privacy protection in accordance with the HIPAA
      Safe Harbor Method. More information can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
  days_to_study:
    type: number
    description: The number of days between the case's index date and the date of
      the imaging study. This property is included to ensure personal privacy protection
      in accordance with the HIPAA Safe Harbor Method. More information can be found
      here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
  image_data_modified:
    type: boolean
    description: An indicator of whether any post-clinical modification of image pixel
      data has been performed on the study.
  loinc_code:
    type: string
    description: The LOINC code assigned based on the study description provided.
      The Logical Observation Identifiers, Names, and Codes (LOINC) standard is A
      common language (set of identifiers, names, and codes) for clinical and laboratory
      observations.
  loinc_contrast:
    type: string
    description: The LOINC indicator noting whether the image was completed with or
      without contrast, as associated with the assigned LOINC code. The Logical Observation
      Identifiers, Names, and Codes (LOINC) standard is A common language (set of
      identifiers, names, and codes) for clinical and laboratory observations.
  loinc_long_common_name:
    type: string
    description: The LOINC long common name associated with the assigned LOINC code.
      The Logical Observation Identifiers, Names, and Codes (LOINC) standard is A
      common language (set of identifiers, names, and codes) for clinical and laboratory
      observations.
  loinc_method:
    type: string
    description: The LOINC method or imaging modality associated with the assigned
      LOINC code. The Logical Observation Identifiers, Names, and Codes (LOINC) standard
      is A common language (set of identifiers, names, and codes) for clinical and
      laboratory observations.
  loinc_system:
    type: string
    description: The LOINC system or body part examined associated with the assigned
      LOINC code. The Logical Observation Identifiers, Names, and Codes (LOINC) standard
      is A common language (set of identifiers, names, and codes) for clinical and
      laboratory observations.
  study_description:
    type: string
    description: (0008, 1030) Study Description.
  study_modality:
    type: array
    items:
      type: string
    description: The modalities of the imaging study; derived from (0008, 0060) Modality.
  study_uid:
    type: string
    description: (0020, 000d) Study Instance UID.
  study_year:
    type: integer
    description: The year when imaging study was performed; year component of Study
      Date (0008, 0020).
  study_year_shifted:
    type: boolean
    description: Indicates whether the study year has been shifted for de-identification.
      This property is included to ensure personal privacy protection in accordance
      with the HIPAA Safe Harbor Method. More information can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
  datasets:
    type: string
    description: The submitter_id or id of the dataset this case belongs to, i.e.,
      a link to a record in the parent node.
  loinc_modality:
    type: string
    description: The LOINC method or imaging modality associated with the assigned
      LOINC code
  modality:
    description: Modality of the imaging study, derived from DICOM tag (0008,0060)
    enum:
    - PET
    - CT
    - SPECT
    - MRI
  SUV_max:
    type: number
    description: highest point of radioactive tracer concentration in region of tissue
  mean_SUV:
    type: number
    description: average concentration of radiopharmaceutical within a specific region
  tumor_volume:
    type: number
    description: volume of tumor
  scan_timepoint:
    type: integer
    description: Days from treatment cycle start at which this imaging study was acquired,
      to support multi-timepoint time-series linking
  cases:
    $ref: _definitions.yaml#/to_one
  therapy_cycles:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
