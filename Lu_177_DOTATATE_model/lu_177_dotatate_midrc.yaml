version: 0.3.0
url: http://localhost
nodes:
- name: case
  title: Case
  description: The collection of all data related to a specific patient or case in the context
    of a specific dataset or experiment.
  category: administrative
  properties:
  - name: case_ids
    type: array
    description: A human-readable, unique identifier for a record in the metadata database. It can be used in place of the UUID for identifying or recalling a record (e.g., in data queries or uploads/exports).
    required: false
  - name: age_at_index
    type: number
    description: The study participant's age, in years, at the index event. The index event
      is determined by the data submitter and used as an anchor date for all temporal variables.
      Note that an age of 0 indicates a participant who is younger than 1 year old. For participants
      with ages greater than 89 years, please use the property 'age_at_index_gt89'. This property
      is included to ensure personal privacy protection in accordance with the HIPAA Safe
      Harbor Method. More information can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    minimum: 0
    maximum: 89
    required: false
  - name: age_at_index_gt89
    type: enum
    enums:
    - 'Yes'
    - 'No'
    description: Indicates whether the subject's age at the time of the study was greater
      than 89 years. This property is included to ensure personal privacy protection in accordance
      with the HIPAA Safe Harbor Method. More information can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    required: false
  - name: country_of_residence
    type: string
    description: The country where the subject resides.
    required: false
  - name: covid19_positive
    type: enum
    enums:
    - 'Yes'
    - 'No'
    - Indeterminate
    - Not Reported
    description: 'An indicator of whether the patient has ever had a positive COVID-19 test
      or been diagnosed with one of the following ICD-10 COVID-19 conditions: COVID-19 (U07.
      1), Influenza due to unidentified influenza virus with other manifestations (J11.8),
      Post COVID-19 condition (U09.9), Myalgic encephalomyelitis/chronic fatigue syndrome
      (G93.32), or Sequelae of other specified infectious and parasitic diseases (B94.8).
      For more information about a patient''s specific COVID-19 diagnosis, details can be
      found under Condition.'
    required: false
  - name: ethnicity
    type: enum
    enums:
    - Hispanic or Latino
    - Not Hispanic or Latino
    - Not Reported
    description: A social group characterized by a distinctive social and cultural tradition
      that is maintained from generation to generation. Members share a common history and
      origin and a sense of identification with the group. They have similar and distinctive
      features in their lifestyle habits and shared experiences. They often have a common
      genetic heritage which may be reflected in their experience of health and disease.
    required: false
  - name: gen3_linked_subjects_available
    type: boolean
    description: Indicates whether there is data available for the subject in other data resources.
    required: false
  - name: icu_indicator
    type: boolean
    description: Indicates whether the subject has been admitted to the ICU.
    required: false
  - name: index_event
    type: enum
    enums:
    - COVID-19 Test
    - Long COVID Diagnosis
    - Study Enrollment
    - First Imaging Study
    description: The event used as the anchor or start date for all temporal data elements.
      This acts as day 0 on a timeline of events relating to the patient. This property is
      included to ensure personal privacy protection in accordance with the HIPAA Safe Harbor
      Method. More information can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    required: false
  - name: linked_external_data
    type: array
    description: A list of all external data resources that are confirmed to have data for
      the case.
    required: false
  - name: long_covid_diagnosis
    type: enum
    enums:
    - Positive
    - Not Reported
    description: 'An indicator of whether the patient has ever been diagnosed with one of
      the following ICD-10 long COVID-19 conditions: U09.9 (Post COVID-19 condition, unspecified),
      G93.32 (Myalgic encephalomyelitis/chronic fatigue syndrome), and B94.8 (Sequelae of
      other specified infectious and parasitic diseases). ''Positive'' means the patient was
      diagnosed with a long COVID condition, while ''Not Reported'' means the patient has
      never been diagnosed with a long COVID condition.'
    required: false
  - name: race
    type: enum
    enums:
    - American Indian or Alaska Native
    - Asian
    - Black or African American
    - Native Hawaiian or other Pacific Islander
    - Other
    - White
    - Not Reported
    description: A geographic ancestral origin category that is assigned to a population group
      based mainly on physical characteristics that are thought to be distinct and inherent.
    required: false
  - name: sex
    type: enum
    enums:
    - Female
    - Male
    - Not Reported
    description: The biologic character or quality that distinguishes male and female from
      one another as expressed by analysis of the person's gonadal, morphologic (internal
      and external), chromosomal, and hormonal characteristics.
    required: false
  - name: site_id
    type: string
    description: A de-identified code used to classify a case as part of a specific data submission.
    required: false
  - name: token_record_id
    type: string
    description: An ID used to link a de-identified case in MIDRC to the same case in an external
      data resource.
    required: false
  - name: treatment_info
    type: boolean
    description: Indicates whether detailed treatment information is available for the subject.
    required: false
  - name: ventilator_indicator
    type: boolean
    description: Indicates whether the subject has been on a ventilator.
    required: false
  - name: zip
    type: string
    description: The three-digit United States zip code of residence for any population greater
      than 20,000. For zip codes where the three digit number represents a population less
      than 20,000 "000" will be provided.
    required: false
  - name: case_id
    type: string
    description: A deidentified identifier for the subject
    required: true

- name: condition
  title: Condition
  description: Information related to the condition(s) of a case within the context of a particular
    study (e.g., a medical diagnoses, comorbidities). This includes a snapshot of the case's
    status with respect to certain diseases, disorders, symptoms, injuries, or illnesses within
    the context of the study.
  category: medical_history
  properties:
  - name: case_ids
    type: array
    description: A human-readable, unique identifier for a record in the metadata database. It can be used in place of the UUID for identifying or recalling a record (e.g., in data queries or uploads/exports).
    required: false
  - name: condition_code
    type: string
    description: The code for a specific condition, assigned by the code system.
    required: false
  - name: condition_code_system
    type: string
    description: The system that assigned the code for a specific condition.
    required: false
  - name: condition_name
    type: string
    description: The name of the condition the patient has experienced.
    required: false
  - name: days_to_condition_end
    type: integer
    description: The number of days from the index date to the date the subject no longer
      experienced the condition. This property is included to ensure personal privacy protection
      in accordance with the HIPAA Safe Harbor Method. More information can be found here
      https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    required: false
  - name: days_to_condition_start
    type: integer
    description: The number of days from the index date to the date the subject was diagnosed
      with or began experiencing the condition. This property is included to ensure personal
      privacy protection in accordance with the HIPAA Safe Harbor Method. More information
      can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    required: false
  - name: performance_status_ECOG
    type: enum
    enums:
    - '0'
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    description: ECOG performance status score describing patient's level of functioning and
      ability to perform daily activities
    required: false

- name: core_metadata_collection
  title: Core Metadata Collection
  description: A collection of data files in a project.
  category: administrative
  properties:
  - name: case_ids
    type: array
    description: A human-readable, unique identifier for a record in the metadata database. It can be used in place of the UUID for identifying or recalling a record (e.g., in data queries or uploads/exports).
    required: false
  - name: contributor
    type: string
    description: An entity responsible for making contributions to the resource. Examples
      of a Contributor include a person, an organization, or a service. Typically, the name
      of a Contributor should be used to indicate the entity.
    required: false
  - name: coverage
    type: string
    description: The spatial or temporal topic of the resource, the spatial applicability
      of the resource, or the jurisdiction under which the resource is relevant. Spatial topic
      and spatial applicability may be a named place or a location specified by its geographic
      coordinates. Temporal topic may be a named period, date, or date range. A jurisdiction
      may be a named administrative entity or a geographic place to which the resource applies.
      Recommended best practice is to use a controlled vocabulary such as the Thesaurus of
      Geographic Names [TGN] (http-//www.getty.edu/research/tools/vocabulary/tgn/index.html).
      Where appropriate, named places or time periods can be used in preference to numeric
      identifiers such as sets of coordinates or date ranges.
    required: false
  - name: creator
    type: string
    description: An entity primarily responsible for making the resource. Examples of a Creator
      include a person, an organization, or a service. Typically, the name of a Creator should
      be used to indicate the entity.
    required: false
  - name: data_type
    type: string
    description: The nature or genre of the resource. Recommended best practice is to use
      a controlled vocabulary such as the DCMI Type Vocabulary [DCMITYPE](https://www.dublincore.org/specifications/dublin-core/dcmi-type-vocabulary/).
      To describe the file format, physical medium, or dimensions of the resource, use the
      Format element.
    required: false
  - name: date
    type: string
    description: The date the collection of data was created.
    required: false
  - name: description
    type: string
    description: An account of the resource. Description may include but is not limited to-
      an abstract, a table of contents, a graphical representation, or a free-text account
      of the resource.
    required: false
  - name: format
    type: string
    description: The file format, physical medium, or dimensions of the resource. Examples
      of dimensions include size and duration. Recommended best practice is to use a controlled
      vocabulary such as the list of Internet Media Types [MIME] (http-//www.iana.org/assignments/media-types/).
    required: false
  - name: language
    type: string
    description: A language of the resource. Recommended best practice is to use a controlled
      vocabulary such as RFC 4646 (http-//www.ietf.org/rfc/rfc4646.txt).
    required: false
  - name: publisher
    type: string
    description: An entity responsible for making the resource available. Examples of a Publisher
      include a person, an organization, or a service. Typically, the name of a Publisher
      should be used to indicate the entity.
    required: false
  - name: relation
    type: string
    description: A related resource. Recommended best practice is to identify the related
      resource by means of a string conforming to a formal identification system.
    required: false
  - name: rights
    type: string
    description: Information about rights held in and over the resource. Typically, rights
      information includes a statement about various property rights associated with the resource,
      including intellectual property rights.
    required: false
  - name: source
    type: string
    description: A related resource from which the described resource is derived. The described
      resource may be derived from the related resource in whole or in part. Recommended best
      practice is to identify the related resource by means of a string conforming to a formal
      identification system.
    required: false
  - name: subject
    type: string
    description: The topic of the resource. Typically, the subject will be represented using
      keywords, key phrases, or classification codes. Recommended best practice is to use
      a controlled vocabulary.
    required: false
  - name: title
    type: string
    description: A name given to the resource. Typically, a Title will be a name by which
      the resource is formally known.
    required: false

- name: cr_series_file
  title: CR Series File
  description: A package of image files and metadata related to a CR imaging series to which
    one or more computed radiograph (CR) instances belong.
  category: imaging
  properties:
  - name: submitter_id
    type: array
    description: A human-readable, unique identifier for a record in the metadata database. It can be used in place of the UUID for identifying or recalling a record (e.g., in data queries or uploads/exports).
    required: true
  - name: md5sum
    type: string
    description: The 128-bit hash value expressed as a 32 digit hexadecimal number used as a file's digital fingerprint.
    required: true
  - name: file_size
    type: integer
    description: The size of the data file (object) in bytes.
    required: true
  - name: file_name
    type: string
    description: The name (or part of a name) of a file (of any type).
    required: true
  - name: contrast_bolus_agent
    type: array
    description: (0018, 0010) Contrast/Bolus Agent.
    required: false
  - name: detector_type
    type: enum
    enums:
    - DIRECT
    - SCINTILLATOR
    - STORAGE
    - FILM
    description: (0018, 7004) Detector Type.
    required: false
  - name: image_data_modification_name
    type: integer
    description: A MIDRC classification describing specific methods (e.g., software tools,
      processes) used to modify the study series. More information can be found at midrc.org.
    required: false
  - name: image_data_modification_method
    type: enum
    enums:
    - Removal of alphanumeric characters
    - Defacing
    - Skull-stripping
    description: A categorical description of the type of image modification performed on
      the study series.
    required: false
  - name: image_data_modified
    type: boolean
    description: An indicator of whether any post-clinical modification of image pixel data
      has been performed on the study series.
    required: false
  - name: image_type
    type: array
    description: (0008, 0008) Image Type.
    required: false
  - name: imager_pixel_spacing
    type: array
    description: (0018, 1164) Imager Pixel Spacing.
    required: false
  - name: lossy_image_compression
    type: enum
    enums:
    - '00'
    - '01'
    description: (0028, 2110) Lossy Image Compression; Note, if an image is compressed with
      a lossy algorithm, the Attribute Lossy Image Compression (0028,2110) is set to "01".
      Subsequently, if the image is decompressed and transferred in uncompressed format, this
      Attribute value remains "01".
    required: false
  - name: manufacturer
    type: string
    description: (0008, 0070) Manufacturer.
    required: false
  - name: manufacturer_model_name
    type: string
    description: (0008, 1090) Manufacturer's Model Name.
    required: false
  - name: modality
    type: string
    description: (0008, 0060) Modality.
    required: false
  - name: number_of_instances
    type: integer
    description: The number of instances included in this series.
    required: false
  - name: pixel_spacing
    type: array
    description: (0028, 0030) Pixel Spacing.
    required: false
  - name: series_description
    type: string
    description: (0008, 103e) Series Description.
    required: false
  - name: series_uid
    type: string
    description: (0020, 000e) Series Instance UID.
    required: false
  - name: spatial_resolution
    type: number
    description: (0018, 1050) Spatial Resolution.
    required: false
  - name: view_position
    type: array
    description: (0018, 5101) View Position.
    required: false
  - name: data_category
    type: enum
    enums:
    - CR
    description: Broad categorization of the contents of the data file.
    required: true
  - name: data_format
    type: enum
    enums:
    - DCM
    - nii.gz
    description: Format of the data files.
    required: true
  - name: data_type
    type: enum
    enums:
    - DICOM
    - NIfTI
    description: Specific content type of the data file.
    required: true

