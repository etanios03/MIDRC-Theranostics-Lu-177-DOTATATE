- name: dataset
  title: Dataset
  description: A set of metadata and associated data file objects originating from single
    a research study, clinical trial or patient cohort.
  category: administrative
  properties:
  - name: acknowledgement
    type: string
    description: Publication acknowledgement(s) for the published dataset.
    required: false
  - name: data_citation
    type: string
    description: The citation for the published dataset.
    required: false
  - name: data_contributor
    type: string
    description: The name of the organization or individual that the contributed dataset belongs
      to.
    required: false
  - name: data_description
    type: string
    description: A brief, free-text description of the data files and associated metadata
      provided for this dataset.
    required: true
  - name: data_url_doi
    type: string
    description: A URL or DOI for the source of the dataset or the contributing organization's
      website.
    required: false
  - name: disease_type
    type: string
    description: The primary type of disease studied in this dataset, if applicable.
    required: false
  - name: full_name
    type: string
    description: The full name or title of the dataset or publication.
    required: false
  - name: license
    type: string
    description: The license under which the dataset has been published.
    required: false
  - name: longitudinal
    type: boolean
    description: Indicates whether the dataset has longitudinal or time-series data.
    required: false
  - name: primary_site
    type: string
    description: The primary body site studied in this dataset.
    required: false
  - name: publication_citation
    type: string
    description: The major or main publication(s) associated with the data itself or with
      the publication that published the dataset.
    required: false
  - name: research_description
    type: string
    description: If the dataset is related to a research study, provide a brief, free-text
      description or abstract of the study being performed, for example, the hypothesis being
      tested and a very brief description of the materials, methods and results.
    required: false
  - name: research_design
    type: string
    description: A summary of the goals of the research or a general description of the research's
      relationship to a clinical application.
    required: false
  - name: research_objective
    type: string
    description: The general objective of the research; what the researchers hope to discover
      or determine.
    required: false
  - name: research_setup
    type: string
    description: A high level description of the setup used to achieve the research objectives.
    required: false

