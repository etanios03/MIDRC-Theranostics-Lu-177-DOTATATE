- name: annotation
  title: Annotation
  description: Information describing characteristics of imaging studies, series and instances
    (e.g., segmentations, bounding boxes, feature labels) and inferences based on those characteristics
    (e.g., predicted diagnoses). Annotations may be recorded in the course of clinical care
    or retrospectively for purposes of research (e.g., imaging annotations from PACS or retrospective
    labeling tools). Please refer to https://midrc.org/annotations to learn more about a particular
    batch of annotations.
  category: notation
  properties:
  - name: submitter_id
    type: array
    description: A human-readable, unique identifier for a record in the metadata database. It can be used in place of the UUID for identifying or recalling a record (e.g., in data queries or uploads/exports).
    required: false
  - name: airspace_disease_grading
    type: enum
    enums:
    - mild
    - moderate
    - severe
    description: Values are extracted from the annotation file midrc_mdai_chestxr. Accepted
      values are "mild" opacities (1-2 lung zones), "moderate" opacities (3-4 lung zones),
      and "severe" opacities (>4 lung zones).
    required: false
  - name: annotator_id
    type: string
    description: Coded value to represent a particular annotator in a group. These need only
      be unique per annotation.
    required: false
  - name: annotation_long_name
    type: string
    description: The long name of the annotation provides more information about the specific
      annotation.
    required: false
  - name: annotation_method
    type: enum
    enums:
    - Clinically_derived
    - Retrospective_expert
    - Retrospective_general
    - Retrospective_auto
    description: Defines the method by which the annotation was created. Clinically_derived
      - Based on information produced in the process of the subject's medical care; Retrospective_expert
      - Based on information produced retrospective to the subject's care by annotators with
      relevant special clinical expertise; Retrospective_general - Based on information produced
      retrospective to the subject's care by annotators without relevant special clinical
      expertise; Retrospective_auto - Based on information produced retrospective to the subject's
      care using automated means.
    required: false
  - name: annotation_name
    type: enum
    enums:
    - midrc_bpr_landmarks
    - midrc_bpr_regions
    - midrc_lung_segs
    - midrc_lung_measures
    - midrc_mdai_chestxr
    - midrc_mRALE_Mastermind_Challenge
    - SIFT
    description: The name of the annotation. These names are unique and assigned by MIDRC.
      Annotation names reference a document posted on the MIDRC website describing the annotation,
      methods and values expected. All MIDRC created annotations start with "midrc_".
    required: false
  - name: class_covid19_pneumonia
    type: enum
    enums:
    - atypical
    - indeterminate
    - negative
    - typical
    description: Values are extracted from the annotation file midrc_mdai_chestxr; Accepted
      values include "typical" appearance, which is multifocal bilateral, peripheral opacities,
      or opacities with rounded morphology, lower lung-predominant distribution; "indeterminate"
      appearance, which is absence of typical findings and unilateral, central or upper lung
      predominant distribution of airspace disease; "atypical" appearance, which is pneumothorax
      or pleural effusion, pulmonary edema, lobar consolidation, solitary lung nodule, or
      mass diffuse tiny nodules cavity; "negative" for pneumonia, which is no lung opacities.
    required: false
  - name: instance_uids
    type: array
    description: Used to denote that this annotation applies only to specific images (image
      instances) in a series. If absent, an annotation that references an imaging series node
      applies to the entire imaging series.
    required: false
  - name: midrc_mRALE_score
    type: integer
    description: Values are extracted from the annotation file mRALE_Mastermind_Challenge.
      The Radiographic Assessment of Lung Edema (RALE) score is provided as a reference standard
      assessment of disease severity on chest radiograph. A normal chest radiograph receives
      a score of 0, while a chest radiograph with complete consolidation of both lungs receives
      the maximum score of 24.
    minimum: 0
    maximum: 24
    required: false
  - name: sift_image_quality_index
    type: enum
    enums:
    - A
    - B
    - C
    - D
    - Not Reported
    description: A score of image quality based on the SIFT annotation software.
    required: false
  - name: software_version
    type: string
    description: (0018, 1020) Software Version(s).
    required: false

- name: annotation_file
  title: Annotation File
  description: The annotation_file node provides the ability to link a file containing annotation
    information to a case, imaging study or imaging series.
  category: data_file
  properties:
  - name: submitter_id
    type: array
    description: A human-readable, unique identifier for a record in the metadata database. It can be used in place of the UUID for identifying or recalling a record (e.g., in data queries or uploads/exports).
    required: false
  - name: annotation_long_name
    type: string
    description: The long name of the annotation provides more information about the specific
      annotation.
    required: false
  - name: annotation_method
    type: enum
    enums:
    - Clinically_derived
    - Retrospective_expert
    - Retrospective_general
    - Retrospective_auto
    description: Defines the method by which the annotation was created. Clinically_derived
      - Based on information produced in the process of the subject's medical care; Retrospective_expert
      - Based on information produced retrospective to the subject's care by annotators with
      relevant special clinical expertise; Retrospective_general - Based on information produced
      retrospective to the subject's care by annotators without relevant special clinical
      expertise; Retrospective_auto - Based on information produced retrospective to the subject's
      care using automated means.
    required: false
  - name: annotation_name
    type: enum
    enums:
    - midrc_bpr_landmarks
    - midrc_bpr_regions
    - midrc_lung_segs
    - midrc_lung_measures
    - midrc_mdai_chestxr
    - midrc_mRALE_Mastermind_Challenge
    - uchicago_msk_shoulder_labrum
    - duke-CSpineSeg
    - SIFT
    description: The name of the annotation. These names are unique and assigned by MIDRC.
      Annotation names reference a document posted on the MIDRC website describing the annotation,
      methods and values expected. All MIDRC created annotations start with "midrc_".
    required: true
  - name: annotator_id
    type: string
    description: Coded value to represent a particular annotator in a group. These need only
      be unique per annotation.
    required: false
  - name: instance_uids
    type: array
    description: Used to denote that this annotation applies only to specific images (image
      instances) in a series. If absent, an annotation that references an imaging series node
      applies to the entire imaging series.
    required: false
  - name: software_versions
    type: string
    description: (0018,1020) Software Versions. This is the software version of the application
      where the annotation series was created.
    required: false
  - name: data_category
    type: enum
    enums:
    - annotation_file
    description: The category of the file; must be "annotation_file".
    required: true
  - name: data_format
    type: enum
    enums:
    - XML
    - JSON
    - CSV
    - JPEG
    - TIF
    - TXT
    - NII
    description: The file format of the annotation file, e.g., JSON.
    required: true
  - name: data_type
    type: enum
    enums:
    - Internal Annotation
    - External Annotation
    description: An indication of whether the annotation is expert validated by MIDRC (“Internal
      Annotation”) or has not been validated by MIDRC experts (“External Annotation”).
    required: true

- name: dicom_annotation_file
  title: DICOM Annotation Series File
  description: The dicom_annotation_file node provides the ability to link a DICOM series
    file containing annotation information to an imaging study.
  category: data_file
  properties:
  - name: submitter_id
    type: array
    description: A human-readable, unique identifier for a record in the metadata database. It can be used in place of the UUID for identifying or recalling a record (e.g., in data queries or uploads/exports).
    required: true
  - name: annotation_method
    type: enum
    enums:
    - Clinically_derived
    - Retrospective_expert
    - Retrospective_general
    - Retrospective_auto
    description: Defines the method by which the annotation was created. Clinically_derived
      - Based on information produced in the process of the subject's medical care; Retrospective_expert
      - Based on information produced retrospective to the subject's care by annotators with
      relevant special clinical expertise; Retrospective_general - Based on information produced
      retrospective to the subject's care by annotators without relevant special clinical
      expertise; Retrospective_auto - Based on information produced retrospective to the subject's
      care using automated means.
    required: false
  - name: annotator_id
    type: string
    description: Coded value to represent a particular annotator in a group. These need only
      be unique per annotation.
    required: false
  - name: series_description
    type: string
    description: (0008, 103e) Series Description; a general description of or additional information
      about the imaging series. If possible, the Series Description should match the annotation_name
      provided.
    required: true
  - name: annotation_name
    type: enum
    enums:
    - midrc_bpr_landmarks
    - midrc_bpr_regions
    - midrc_lung_segs
    - midrc_lung_measures
    - midrc_mdai_chestxr
    - midrc_mRALE_Mastermind_Challenge
    - SIFT
    description: The name of the annotation. These names are unique and assigned by MIDRC.
      Annotation names reference a document posted on the MIDRC website describing the annotation,
      methods and values expected. All MIDRC created annotations start with "midrc_".
    required: true
  - name: manufacturer
    type: string
    description: (0008, 0070) Manufacturer
    required: false
  - name: manufacturer_model_name
    type: string
    description: (0008, 1090) Manufacturer's Model Name
    required: false
  - name: modality
    type: enum
    enums:
    - RTSTRUCT
    - PR
    - SR
    - SEG
    - DOC
    - OT
    description: (0008, 0060) Modality
    required: true
  - name: series_uid
    type: string
    description: (0020, 000e) Series Instance UID; the UID or unique identification code of
      the imaging series.
    required: true
  - name: software_versions
    type: string
    description: (0018,1020) Software Versions. This is the software version of the application
      where the annotation series was created.
    required: false
  - name: data_category
    type: enum
    enums:
    - DICOM Annotation Series File
    description: The category of the annotation file. Must be "DICOM Annotation Series File".
    required: true
  - name: data_format
    type: enum
    enums:
    - DCM
    description: The file format of the annotation file, e.g., JSON.
    required: true
  - name: data_type
    type: enum
    enums:
    - Internal Annotation
    - External Annotation
    description: An indication of whether the annotation is expert validated by MIDRC (“Internal
      Annotation”) or has not be validated by MIDRC experts (“External Annotation”).
    required: true

- name: radiology_report
  title: Radiology Report
  description: A detailed report that describes the results of an imaging test. A radiology
    report can include narrative information about the type of imaging test that was done,
    how it was done, and any labels representing the results of the test.
  category: data_file
  properties:
  - name: submitter_id
    type: array
    description: A human-readable, unique identifier for a record in the metadata database. It can be used in place of the UUID for identifying or recalling a record (e.g., in data queries or uploads/exports).
    required: false
  - name: body_part_examined
    type: array
    description: (0018, 0015) Body Part Examined.
    required: false
  - name: data_category
    type: enum
    enums:
    - Radiology Report
    description: Broad categorization of the contents of the data file.
    required: true
  - name: data_format
    type: enum
    enums:
    - CSV
    - DICOM
    - JSON
    - PDF
    - RTF
    - TSV
    - TXT
    - XML
    description: Format of the data files.
    required: true
  - name: data_type
    type: enum
    enums:
    - Radiology Report
    description: Specific content type of the data file.
    required: true
  - name: modality
    type: string
    description: (0008, 0060) Modality
    required: false
  - name: report_generation_method
    type: enum
    enums:
    - Clinical
    - Synthetic
    description: A categorical description of the way the report was generated, either through
      clinical care (Clinical) or through computational means (Synethic).
    required: false
  - name: report_modification_method
    type: enum
    enums:
    - Redacted
    - Synthetic replacement
    description: A categorical description of the type of modification performed on the report,
      either by redaction of sensitive information (Redacted) or by obscuring it through replacement
      with random or shifted values (Synthetic replacement).
    required: false
  - name: study_description
    type: string
    description: (0008, 1030) Study Description.
    required: false

- name: supplementary_file
  title: Supplementary File
  description: Supplementary files associated with a study.
  category: data_file
  properties:
  - name: submitter_id
    type: array
    description: A human-readable, unique identifier for a record in the metadata database. It can be used in place of the UUID for identifying or recalling a record (e.g., in data queries or uploads/exports).
    required: false
  - name: file_description
    type: string
    description: Free text to expand upon details for this file
    required: false
  - name: data_type
    type: string
    description: The type of supplementary file, for example, figures, tables, clinical data,
      notes, publications, summary statistics, etc.
    required: true
  - name: data_category
    type: string
    description: The text term describing the broad category that the supplementary file falls
      into.
    required: true
  - name: data_format
    type: string
    description: The text term describing the file format of the supplementary file, for example,
      PDF, XLSX, JPEG, PNG, TSV, etc.
    required: true

- name: surgical_information
  title: Surgical Information
  description: Surgery performed before or after RPT therapy
  category: medical_history
  properties:
  - name: submitter_id
    type: array
    description: A list of one or more case submitter_ids associated with the data
    required: true
  - name: date_of_surgery
    type: datetime
    description: Surgery date
    required: false
  - name: primary_tumor_removal
    type: boolean
    description: Whether the tumor has been removed through surgery
    required: false
  - name: time_between_RPT_surgery
    type: integer
    description: Time in days between the surgery event and the start of RPT treatment
    required: false
  - name: pre_tumor_volume
    type: number
    description: Tumor volume pre-surgery, if debulking surgery was performed
    required: false
  - name: post_tumor_volume
    type: number
    description: Tumor volume post-surgery, if debulking surgery was performed
    required: false
  - name: debulking_threshold
    type: number
    description: The goal optimal debulking threshold depending on cancer type; typically
      around 0.7 for NETs
    required: false

- name: prior_treatment
  title: Prior Treatment
  description: General information regarding other treatments including hormone therapy, chemotherapy,
    somatostatin analog therapy, etc.
  category: medical_history
  properties:
  - name: submitter_id
    type: array
    description: A list of one or more case submitter_ids associated with the data
    required: true
  - name: therapy_type
    type: enum
    enums:
    - hormone_therapy
    - chemotherapy
    - immunotherapy
    - systemic_radiation_therapy
    - liver_directed_therapy
    - other
    description: Type of therapy applied before or alongside RPT
    required: false
  - name: start_therapy_date
    type: datetime
    description: Start date of therapy
    required: false
  - name: end_therapy_date
    type: datetime
    description: End date of therapy
    required: false
  - name: time_between_RPT_other
    type: integer
    description: Time in days between the end of this therapy and the start of RPT therapy
    required: false
  - name: pre_tumor_volume
    type: number
    description: Tumor volume before start of treatment
    required: false
  - name: post_tumor_volume
    type: number
    description: Tumor volume after treatment
    required: false
  - name: response_to_therapy
    type: string
    description: Response to prior therapy, completed or stopped and reasoning
    required: false
  - name: response_criteria
    type: string
    description: criteria used for response to therapy
    required: false

- name: lesion
  title: Lesion
  description: Tumor information prior to RPT treatment
  category: clinical
  properties:
  - name: submitter_id
    type: array
    description: A list of one or more case submitter_ids associated with the data
    required: true
  - name: tumor_site
    type: string
    description: Primary tumor location
    required: false
  - name: AJCC_stage
    type: string
    description: Staging of cancer progression through the AJCC system
    required: false
  - name: tumor_grade
    type: string
    description: Categorization of tumor through level of cell differentiation, determined
      through analysis of tissue samples
    required: false
  - name: extra_abdominal_mets
    type: boolean
    description: Whether the tumor has metastasized
    required: false
  - name: ki_67
    type: number
    description: Ki-67 marker expression, strongly associated with tumor cell proliferation
      and growth
    required: false

- name: treatment_course
  title: Treatment Course
  description: Description of an overall course of radiopharmaceutical treatments
  category: clinical
  properties:
  - name: submitter_id
    type: array
    description: A list of one or more case submitter_ids associated with the data
    required: true
  - name: radiopharmaceutical
    type: string
    description: Name of the radiopharmaceutical administered, e.g. [177Lu]Lu-DOTATATE
    required: false
  - name: therapy_type
    type: enum
    enums:
    - alpha
    - beta
    - auger
    - other
    description: Type of ionizing radiation delivered by the radiopharmaceutical
    required: false
  - name: number_of_cycles
    type: integer
    description: the number of cycles
    required: false
  - name: start_date
    description: the start date of treatment
    type: datetime
    required: false

- name: therapy_cycle
  title: Therapy Cycle
  description: A single cycle of RPT treatment, including radiopharmaceutical administered
    and activity delivered
  category: clinical
  properties:
  - name: submitter_id
    type: array
    description: A list of one or more case submitter_ids associated with the data
    required: true
  - name: cycle_number
    type: integer
    description: The sequential number of this treatment cycle
    required: true
  - name: injected_activity
    type: number
    description: Net activity injected during this treatment cycle, in MBq
    required: false
  - name: therapeutic_target
    type: string
    description: Intended molecular or anatomical therapeutic target, e.g. SSTR2
    required: false
  - name: start_date
    type: datetime 
    description: Start date of the cycle 
  - name: end_date 
    type: datetime
    description: End date of the cycle 


- name: laboratory_panel
  title: Laboratory Panel
  description: Laboratory test results linked to a treatment cycle, including renal function
    and blood work
  category: clinical
  properties:
  - name: submitter_id
    type: array
    description: A list of one or more case submitter_ids associated with the data
    required: true
  - name: loinc_code
    type: string
    description: LOINC code identifying the laboratory test performed
    required: false
  - name: lab_value
    type: number
    description: Numeric result of the laboratory test
    required: false
  - name: lab_unit
    type: string
    description: Unit of measurement for the lab result
    required: false
  - name: collection_timepoint
    type: integer
    description: Days from treatment cycle start at which the sample was collected
    required: false

- name: dosimetry
  title: Dosimetry
  description: Dosimetry for a target organ or lesion within a treatment cycle
  category: clinical
  properties:
  - name: submitter_id
    type: array
    description: A list of one or more case submitter_ids associated with the data
    required: true
  - name: target
    type: enum
    enums:
    - liver
    - kidneys
    - marrow
    - salivary_glands
    - lungs
    - spleen
    - rest_of_body
    - lesion
    description: Anatomical target for which absorbed dose was calculated
    required: false
  - name: target_id
    type: integer
    description: Lesion ID to track lesion identity and lifecycle across treatment cycles
    required: false
  - name: mean
    type: number
    description: Mean absorbed dose delivered to the target in Gy
    required: false
  - name: SD
    type: number
    description: Standard deviation of absorbed dose
    required: false
  - name: D50
    type: number
    description: Minimum absorbed dose received by the hottest 50% of the volume of the organ
    required: false
  - name: D90
    type: number
    description: Minimum absorbed dose received by the hottest 90% of the volume of the organ
    required: false
  - name: lesion_volume
    type: number
    description: Lesion volume in mL, tracked across treatment cycles to monitor response
    required: false
  - name: cycle_num
    type: integer
    description: Treatment cycle number to which this dose estimate corresponds
    required: false
  - name: dosimetry_method
    type: enum
    enums:
    - MIRD
    - voxel_dosimetry
    - Monte_Carlo
    - other
    description: Computational method used to derive the absorbed dose estimate
    required: false
  - name: software_used
    type: string
    description: Software used to perform dosimetry calculations, e.g. OLINDA, MIM, Michigan
      Dosimetry Code
    required: false
  - name: time_activity_curve_fit
    type: string
    description: Functional form used to fit the time-activity curve, e.g. monoexponential
    required: false

- name: spect_image_series
  title: SPECT Image Series
  description: SPECT imaging files reflecting one acquisition
  category: imaging
  properties:
  - name: submitter_id
    type: array
    description: A list of one or more case submitter_ids associated with the data
    required: true
  - name: injected_activity
    type: number
    description: injected activity
    required: false
  - name: administration_time
    type: datetime
    description: time of injection
    required: false
  - name: imaging_time
    type: datetime
    description: time of imaging
    required: false
  - name: image_acquisition_params
    type: array
    description: parameters used for image acquisition
    required: false
  - name: image_reconstruction_params
    type: array
    description: parameters used for image reconstruction
    required: false
  - name: image_units
    type: string
    description: Units of the SPECT image voxel values, e.g. counts, counts/s, Bq/mL or MBq;
      corresponds to DICOM tag (0054,1001) Units where available
    required: false
  - name: calibration_factor
    type: number
    description: SPECT system sensitivity calibration factor used to convert reconstructed
      counts to activity for quantitative imaging
    required: false
  - name: collimator
    type: string
    description: (0018,1180) Collimator/grid Name. Name of the collimator used for the
      SPECT acquisition
    required: false 

- name: clinical_outcome
  title: Clinical Outcome
  description: Clinical outcome data linked to a treatment cycle and dosimetry results, capturing
    treatment response and toxicity
  category: clinical
  properties:
  - name: submitter_id
    type: array
    description: A list of one or more case submitter_ids associated with the data
    required: true
  - name: treatment_response
    type: enum
    enums:
    - complete_response
    - partial_response
    - stable_disease
    - progressive_disease
    - not_evaluable
    description: Treatment response assessment per RECIST or PERCIST criteria
    required: false
  - name: progression_free_survival
    type: number
    description: Length of time in months during and after treatment that the patient lives
      without disease progression
    required: false
  - name: overall_survival
    type: number
    description: Length of time in months from start of treatment until death from any cause
    required: false
  - name: toxicity_grade
    type: enum
    enums:
    - Grade_1
    - Grade_2
    - Grade_3
    - Grade_4
    - Grade_5
    description: Toxicity grade per CTCAE criteria
    required: false
  - name: toxicity_organ
    type: enum
    enums:
    - kidneys
    - marrow
    - liver
    - salivary_glands
    - other
    description: Organ in which toxicity was observed
    required: false
  - name: days_to_progression
    type: integer
    description: Number of days from treatment start to documented disease progression
    required: false
  - name: associated_cycle
    type: string
    description: Clinical Outcome and toxicity associated cycle, if any, or end of course description

