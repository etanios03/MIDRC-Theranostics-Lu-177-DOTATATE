- name: imaging_study
  title: Imaging Study
  description: Information related to an imaging study or exam done for diagnostic or research
    purposes, including patient clinical or contextual data recorded at the time of the imaging
    study.
  category: medical_history
  properties:
  - name: case_ids
    type: array
    description: A human-readable, unique identifier for a record in the metadata database. It can be used in place of the UUID for identifying or recalling a record (e.g., in data queries or uploads/exports).
    required: true
  - name: age_at_imaging
    type: number
    description: The study participant's age, in years, at the time the imaging study was
      performed. Note that an age of 0 indicates a participant who is younger than 1 year
      old. For participants with ages greater than 89 years, please use the property 'age_at_index_gt89'.
    minimum: 0
    maximum: 89
    required: false
  - name: age_at_imaging_gt89
    type: enum
    enums:
    - 'Yes'
    - 'No'
    description: Indicates whether the age of the patient in years at the time the imaging
      study was performed is greater than 89 years. This property is included to ensure personal
      privacy protection in accordance with the HIPAA Safe Harbor Method. More information
      can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    required: false
  - name: body_part_examined
    type: array
    description: (0018, 0015) Body Part Examined.
    required: false
  - name: days_from_study_to_neg_covid_test
    type: array
    description: The number of days from the imaging study to the patient's negative COVID-19
      test(s). This property takes a list of values, each of which represents a COVID-19 test
      for the patient. A positive value for this property means that a negative COVID-19 test
      result was obtained for the patient that many days after the imaging study was performed.
      A negative value indicates that a negative COVID-19 test result was obtained prior to
      the date of imaging. This property is included to ensure personal privacy protection
      in accordance with the HIPAA Safe Harbor Method. More information can be found here
      https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    required: false
  - name: days_from_study_to_pos_covid_test
    type: array
    description: The number of days from the imaging study to the patient's positive COVID-19
      test(s). This property takes a list of values, each of which represents a COVID-19 test
      for the patient. A positive value for this property means that a positive COVID-19 test
      result was obtained for the patient that many days after the imaging study was performed.
      A negative value indicates that the positive COVID-19 test result was obtained prior
      to the date of imaging. This property is included to ensure personal privacy protection
      in accordance with the HIPAA Safe Harbor Method. More information can be found here
      https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    required: false
  - name: days_to_study
    type: number
    description: The number of days between the case's index date and the date of the imaging
      study. This property is included to ensure personal privacy protection in accordance
      with the HIPAA Safe Harbor Method. More information can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    required: false
  - name: image_data_modified
    type: boolean
    description: An indicator of whether any post-clinical modification of image pixel data
      has been performed on the study.
    required: false
  - name: loinc_code
    type: string
    description: The LOINC code assigned based on the study description provided. The Logical
      Observation Identifiers, Names, and Codes (LOINC) standard is A common language (set
      of identifiers, names, and codes) for clinical and laboratory observations.
    required: false
  - name: loinc_contrast
    type: string
    description: The LOINC indicator noting whether the image was completed with or without
      contrast, as associated with the assigned LOINC code. The Logical Observation Identifiers,
      Names, and Codes (LOINC) standard is A common language (set of identifiers, names, and
      codes) for clinical and laboratory observations.
    required: false
  - name: loinc_long_common_name
    type: string
    description: The LOINC long common name associated with the assigned LOINC code. The Logical
      Observation Identifiers, Names, and Codes (LOINC) standard is A common language (set
      of identifiers, names, and codes) for clinical and laboratory observations.
    required: false
  - name: loinc_method
    type: string
    description: The LOINC method or imaging modality associated with the assigned LOINC code.
      The Logical Observation Identifiers, Names, and Codes (LOINC) standard is A common language
      (set of identifiers, names, and codes) for clinical and laboratory observations.
    required: false
  - name: loinc_system
    type: string
    description: The LOINC system or body part examined associated with the assigned LOINC
      code. The Logical Observation Identifiers, Names, and Codes (LOINC) standard is A common
      language (set of identifiers, names, and codes) for clinical and laboratory observations.
    required: false
  - name: study_description
    type: string
    description: (0008, 1030) Study Description.
    required: false
  - name: study_modality
    type: array
    description: The modalities of the imaging study; derived from (0008, 0060) Modality.
    required: false
  - name: study_uid
    type: string
    description: (0020, 000d) Study Instance UID.
    required: false
  - name: study_year
    type: integer
    description: The year when imaging study was performed; year component of Study Date (0008,
      0020).
    required: false
  - name: study_year_shifted
    type: boolean
    description: Indicates whether the study year has been shifted for de-identification.
      This property is included to ensure personal privacy protection in accordance with the
      HIPAA Safe Harbor Method. More information can be found here https://www.hhs.gov/hipaa/for-professionals/special-topics/de-identification/index.html.
    required: false
  - name: datasets
    type: string
    description: The submitter_id or id of the dataset this case belongs to, i.e., a link
      to a record in the parent node.
    required: false
  - name: loinc_modality
    type: string
    description: The LOINC method or imaging modality associated with the assigned LOINC code
    required: false
  - name: modality
    type: enum
    enums:
    - PET
    - CT
    - SPECT
    - MRI
    description: Modality of the imaging study, derived from DICOM tag (0008,0060)
    required: false
  - name: SUV_max
    type: number
    description: highest point of radioactive tracer concentration in region of tissue
    required: false
  - name: mean_SUV
    type: number
    description: average concentration of radiopharmaceutical within a specific region
    required: false
  - name: tumor_volume
    type: number
    description: volume of tumor
    required: false
  - name: scan_timepoint
    type: integer
    description: Days from treatment cycle start at which this imaging study was acquired,
